{% macro navbar(brand="Desire4Meme", username=None, uid=None) %}
<nav class="navbar navbar-expand-lg bg-red shadow-dark-red text-light border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">{{ brand }}</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          {% if username %}
            <a class="nav-link {{ 'active' if active == 'user' }}" href="/user/{{ uid }}">
              <i class="bi bi-person-circle me-1"></i>{{ username }}
            </a>
          {% else %}
            <a class="nav-link {{ 'active' if active == 'login' }}" href="/login">Sign in</a>
          {% endif %}
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endmacro %}
