{% macro navbar(brand="Desire4Meme", user=None) %}
<nav class="navbar navbar-expand-lg bg-red shadow-dark-red text-light border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('core.get_home') }}">{{ brand }}</a>
    {% if user %}
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class = "nav-link" href = "{{ url_for('core.get_create_meme') }}">Create</a>
        </li>
      </ul>
    {% endif %}

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">      
        {% if user %}
          <li class="nav-item">
            <a class="nav-link {{ 'active' if active == 'user' }}" href="{{ url_for('core.get_account') }}">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </a>
          </li>
          <li class="nav-item">
            <a class = "nav-link" href = "{{ url_for('auth.get_logout') }}">Logout</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link {{ 'active' if active == 'login' }}" href="/login">Sign in</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
{% endmacro %}
