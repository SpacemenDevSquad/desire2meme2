{% extends "base.html" %}

{% block title %}Home | Desire4Memes{% endblock %}

{% block head %}
  {# Page-specific <link>/<meta> tags go here #}
  <!-- Import Fabric.js v6 (Global UMD version) -->
  <script src = "https://cdn.jsdelivr.net/npm/fabric@latest/dist/index.min.js"></script>
{% endblock %}

{% block content %}
  {# Header: title + sort + create button #}
  <div class = "align-items-end justify-content-between gap-3 mb-5">
    <div>
      <h1 class = "display-5 fw-bold mb-1 text-ink">Create a Meme</h1>
      <div class = "mb-1">
        <h3 class="text-ink">Upload a Meme Background:</h3>
        <input class="text-ink" type = "file" id = "add_meme_background" accept = "image/*">
      </div>
    </div>

    <div class="container-fluid mt-4 mb-4">
      <canvas class="border mx-auto" id="meme"></canvas>
    </div>

    <div class = "d-inline-block m-2">
        <ul class="d-flex flex-column gap-2">
            <button class = "btn rounded-0 border-0 fw-semibold bg-red text-cream" id = "add_rect">Add Rectangle</button>
            <button class = "btn rounded-0 border-0 fw-semibold bg-red text-cream" id = "add_ellipse">Add Ellipse</button>
            <button class = "btn rounded-0 border-0 fw-semibold bg-red text-cream" id = "add_textbox">Add Textbox</button>
            <button class = "btn rounded-0 border-0 fw-semibold bg-red text-cream" id = "delete"><i class="bi bi-trash"></i></button>
        </ul>
    </div>

    <script type = "module" src = "{{ url_for('static', filename='js/create_meme.js') }}"></script>
  </div>
{% endblock %}
